[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ultima-client-art-tools"
version = "0.1.0"                   # bump as needed, or use dynamic later
description = "Modular toolkit for extracting Ultima Online client assets"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}           # or update if you switched to Britannian Open Codex
authors = [{name = "NerdyGamers"}]
keywords = ["ultima-online", "uo", "client", "art", "extraction", "ultimapy"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "ultimapy",
    "pillow",
    "tqdm",
]

[project.optional-dependencies]
dev = ["ruff", "pytest"]

[project.urls]
Homepage = "https://github.com/NerdyGamers/Ultima-Client-Art-Tools"
Repository = "https://github.com/NerdyGamers/Ultima-Client-Art-Tools.git"
Issues = "https://github.com/NerdyGamers/Ultima-Client-Art-Tools/issues"

[project.scripts]
uoca = "ultima_client_art_tools.main:cli"   # ← this creates `uoca` command
# or uo-art-tools = "ultima_client_art_tools.main:cli"
